services:
  tg_bot:
    command: python3 -m src.main
    build: ./tg_bot
    volumes:
      - ./tg_bot/src:/app/src
      - ./logs:/app/logs
      - ./tg_bot/docs:/app/docs
      - ./db.sqlite3:/app/db.sqlite3
    env_file:
      - .env
    environment:
      TG_API_TOKEN: ${TG_API_TOKEN}
      VK_API_TOKEN: ${VK_API_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}
      VK_BOT_LINK: ${VK_BOT_LINK}
      TG_BOT_LINK: ${TG_BOT_LINK}
      MAX_API_TOKEN: ${MAX_API_TOKEN}
      MAX_BOT_LINK: ${MAX_BOT_LINK}
      LOG_CHAT: ${LOG_CHAT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FILE: ${LOG_FILE}
      LOG_FORMAT: ${LOG_FORMAT}	
      VERIFY_CHAT_ID: ${TG_VERIFY_CHAT_ID}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_KEY: ${S3_KEY}
      S3_SECRET: ${S3_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
    restart: always
  vk_bot:
    command: python3 -m src.main
    build: ./vk_bot
    volumes:
      - ./vk_bot/src:/app/src
      - ./logs:/app/logs
      - ./vk_bot/docs:/app/docs
      - ./db.sqlite3:/app/db.sqlite3
    env_file:
      - .env
    environment:
      TG_API_TOKEN: ${TG_API_TOKEN}
      VK_API_TOKEN: ${VK_API_TOKEN}
      MAX_API_TOKEN: ${MAX_API_TOKEN}
      VK_BOT_LINK: ${VK_BOT_LINK}
      TG_BOT_LINK: ${TG_BOT_LINK}
      MAX_BOT_LINK: ${MAX_BOT_LINK}
      ADMIN_IDS: ${ADMIN_IDS}
      LOG_CHAT: ${LOG_CHAT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FILE: ${LOG_FILE}
      LOG_FORMAT: ${LOG_FORMAT}
      GROUP_ID: ${VK_GROUP_ID}
      SERVICE_TOKEN: ${VK_SERVICE_TOKEN}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_KEY: ${S3_KEY}
      S3_SECRET: ${S3_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
    restart: always
  max_bot:
    command: python3 -m src.main
    build: ./max_bot
    volumes:
      - ./max_bot/src:/app/src
      - ./logs:/app/logs
      - ./max_bot/docs:/app/docs
      - ./db.sqlite3:/app/db.sqlite3
    env_file:
      - .env
    environment:
      VK_API_TOKEN: ${VK_API_TOKEN}
      TG_API_TOKEN: ${TG_API_TOKEN}
      MAX_API_TOKEN: ${MAX_API_TOKEN}
      VK_BOT_LINK: ${VK_BOT_LINK}
      TG_BOT_LINK: ${TG_BOT_LINK}
      MAX_BOT_LINK: ${MAX_BOT_LINK}
      ADMIN_IDS: ${ADMIN_IDS}
      LOG_CHAT: ${LOG_CHAT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FILE: ${LOG_FILE}
      LOG_FORMAT: ${LOG_FORMAT}
      GROUP_ID: ${VK_GROUP_ID}
      SERVICE_TOKEN: ${VK_SERVICE_TOKEN}
      VERIFY_CHAT_ID: ${MAX_VERIFY_CHAT_ID}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_KEY: ${S3_KEY}
      S3_SECRET: ${S3_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
    restart: always
networks:
  app_network:
    driver: bridge
    external: true
